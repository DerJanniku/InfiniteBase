services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: infinitebase
      POSTGRES_USER: infinitebase
      POSTGRES_PASSWORD: localhost_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinitebase"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    command:
      - ./qdrant
      - --storage-snapshot-interval-sec=60

  rust-backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://infinitebase:localhost_only@postgres:5432/infinitebase
      - QDRANT_URL=http://qdrant:6333
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  nextjs-frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    depends_on:
      - rust-backend
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
