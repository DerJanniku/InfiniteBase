[package]
name = "infinitebase-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
qdrant-client = "1.9"
async-trait = "0.1"
multer = "3.0"
mime = "0.3"
bytes = "1.0"
futures = "0.3"
tokio-stream = "0.1"
parking_lot = "0.12"
dotenv = "0.15"
image = "0.24"
base64 = "0.21"

[dev-dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "migrate"] }
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
